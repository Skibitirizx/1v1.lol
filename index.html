<script>
    var buildUrl = "Build"; //%buildUrl
    var loaderUrl = buildUrl + "/WebGL.loader.js";

    var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",

        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "JustPlay.LOL",
        productName: "1v1.LOL Dev",
        productVersion: "4.0"
    };

    var container = document.querySelector("#gameContainer");
    var canvas = document.querySelector("#canvas");
    var loadingBar = document.querySelector("#loader");
    var spinner = loadingBar.querySelector(".spinner")
    var progressBarFull = loadingBar.querySelector(".progress");
    var fullscreenButton = progressBarFull.querySelector(".full");
    var mobileWarning = document.querySelector("#unity-mobile-warning");

    // By default Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up

    // config.matchWebGLToCanvasSize = false;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        // Avoid draining fillrate performance on mobile devices,
        // and default/override low DPI mode on mobile browsers.
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
            mobileWarning.style.display = "none";
        }, 5000);
    }

    let gameInstance;
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            spinner.style.display = "none"
            document.getElementById("percentDiv").innerHTML = (100 * progress + 10).toFixed(0) + "%";
            progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
            loadingBar.style.display = "none";
            window.unityInstance = unityInstance;
            gameInstance = unityInstance;
            window.gameInstance = unityInstance;
        }).catch((message) => {
            alert(message);
        });
    };
    document.body.appendChild(script);

    document.onkeydown = function (e) {
        if (e.altKey || e.ctrlKey || e.key == "F1" || e.key == "F2" || e.key == "F3" || e.key == "F4") {

    document.onmouseup = function (e) {

    }

    document.addEventListener('pointerlockchange', lockChangeAlert, false);
    document.addEventListener('mozpointerlockchange', lockChangeAlert, false);

    function lockChangeAlert() {
        if (!lockedOccured && document.pointerLockElement)
            lockedOccured = true;
        if (!document.pointerLockElement && lockedOccured){
            lockedOccured = false;
            window.unityInstance.SendMessage("Pause Menu", "OnCursorUnlocked");
        }
    }

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Function to remove paragraphs and their parents
    function removeParagraphsAndParents(node) {
        if (node.nodeName.toLowerCase() === "p") {
            // Remove the paragraph element
            node.parentNode.removeChild(node);
        } else {
            // Iterate through child nodes and remove paragraphs
            node.childNodes.forEach(function(child) {
                removeParagraphsAndParents(child);
            });
        }
    }

    // Function to observe mutations in the DOM
    function observeMutations() {
        // Create a new MutationObserver
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                // Check each added node for paragraphs and remove them
                mutation.addedNodes.forEach(function(node) {
                    removeParagraphsAndParents(node);
                });
            });
        });

        // Start observing mutations in the document body
        observer.observe(document.body, { childList: true, subtree: true });
    }

    // Start observing mutations
    observeMutations();
});
    </script>
